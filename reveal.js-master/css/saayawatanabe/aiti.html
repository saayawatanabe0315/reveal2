<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>図書館情報技術論</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=Mochiy+Pop+One&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-1: #ffe3ef;
    --bg-2: #e3f0ff;
    --bg-3: #fff6d9;
    --card-bg: #ffffff;
    --accent-pink: #ff9ec7;
    --accent-purple: #c9a7ff;
    --accent-blue: #9ecfff;
    --accent-yellow: #ffd76e;
    --text-main: #5a4a5c;
    --text-sub: #a48ba8;
    --border-soft: #ffd6e8;
    --shadow-color: rgba(200, 150, 200, 0.25);
    --field-bg: #fff9fc;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg-1: #3a2c3f;
      --bg-2: #2c3550;
      --bg-3: #3f3a2c;
      --card-bg: #2e2433;
      --text-main: #f5e6f0;
      --text-sub: #cbb3d0;
      --border-soft: #5c4a63;
      --shadow-color: rgba(0, 0, 0, 0.4);
      --field-bg: #382b3f;
    }
  }

  :root[data-theme="dark"] {
    --bg-1: #3a2c3f;
    --bg-2: #2c3550;
    --bg-3: #3f3a2c;
    --card-bg: #2e2433;
    --text-main: #f5e6f0;
    --text-sub: #cbb3d0;
    --border-soft: #5c4a63;
    --shadow-color: rgba(0, 0, 0, 0.4);
    --field-bg: #382b3f;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 50%, var(--bg-3) 100%);
    font-family: 'Zen Maru Gothic', 'Hiragino Maru Gothic Pro', sans-serif;
    color: var(--text-main);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 16px;
  }

  .page {
    width: 100%;
    max-width: 640px;
  }

  .floaty {
    position: fixed;
    font-size: 28px;
    opacity: 0.5;
    animation: float 6s ease-in-out infinite;
    pointer-events: none;
    z-index: 0;
    user-select: none;
  }
  .f1 { top: 8%; left: 6%; animation-delay: 0s; }
  .f2 { top: 15%; right: 8%; animation-delay: 1.5s; }
  .f3 { bottom: 12%; left: 10%; animation-delay: 3s; }
  .f4 { bottom: 20%; right: 6%; animation-delay: 4.5s; }

  @keyframes float {
    0%, 100% { transform: translateY(0px) rotate(0deg); }
    50% { transform: translateY(-14px) rotate(8deg); }
  }

  .card {
    position: relative;
    z-index: 1;
    background: var(--card-bg);
    border-radius: 32px;
    padding: 36px 30px 30px;
    box-shadow: 0 12px 30px var(--shadow-color), 0 2px 8px var(--shadow-color);
    border: 3px solid var(--border-soft);
  }

  .card::before {
    content: "";
    position: absolute;
    top: -14px;
    left: 50%;
    transform: translateX(-50%);
    width: 60px;
    height: 28px;
    background: var(--accent-pink);
    border-radius: 20px;
    box-shadow: 0 0 0 4px var(--card-bg);
  }

  .top-deco {
    text-align: center;
    font-size: 22px;
    letter-spacing: 6px;
    margin-bottom: 6px;
    color: var(--accent-pink);
  }

  .field-block {
    margin-bottom: 20px;
  }

  label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 700;
    color: var(--text-sub);
    margin-bottom: 8px;
    letter-spacing: 1px;
  }

  label .emoji { font-size: 15px; }

  .field {
    width: 100%;
    border: 2px solid var(--border-soft);
    background: var(--field-bg);
    border-radius: 16px;
    padding: 12px 16px;
    font-family: inherit;
    color: var(--text-main);
    outline: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }

  .field:focus {
    border-color: var(--accent-pink);
    box-shadow: 0 0 0 4px rgba(255, 158, 199, 0.25);
  }

  #title {
    font-family: 'Mochiy Pop One', 'Zen Maru Gothic', sans-serif;
    font-size: 22px;
    text-align: center;
    color: var(--accent-purple);
  }

  #name {
    font-size: 16px;
    text-align: right;
  }
  #name::placeholder { text-align: right; }

  #heading {
    font-size: 17px;
    font-weight: 700;
    background: linear-gradient(90deg, #fff0f6, transparent);
  }

  #body {
    font-size: 15px;
    line-height: 1.9;
    resize: vertical;
    min-height: 160px;
  }

  .divider {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 22px 0;
    color: var(--accent-pink);
    font-size: 13px;
  }
  .divider::before, .divider::after {
    content: "";
    flex: 1;
    height: 2px;
    background: repeating-linear-gradient(90deg, var(--border-soft) 0 6px, transparent 6px 10px);
  }

  .footer-row {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 24px;
  }

  .chip {
    background: var(--accent-yellow);
    color: #7a5a00;
    border: none;
    padding: 10px 20px;
    border-radius: 999px;
    font-family: inherit;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.12);
    transition: transform 0.15s ease;
  }
  .chip:hover { transform: translateY(-2px) scale(1.03); }
  .chip.pink { background: var(--accent-pink); color: #7a1f47; }
  .chip.blue { background: var(--accent-blue); color: #1f4a7a; }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .chip { color: #2e2433; }
  }
  :root[data-theme="dark"] .chip { color: #2e2433; }

  ::placeholder {
    color: var(--text-sub);
    opacity: 0.6;
  }
</style>
</head>
<body>

<div class="floaty f1">🌸</div>
<div class="floaty f2">💖</div>
<div class="floaty f3">⭐</div>
<div class="floaty f4">🍡</div>

<div class="page">
  <div class="card">
    <div class="top-deco">✧･ﾟ: *✧･ﾟ:*</div>

    <div class="field-block">
      <label><span class="emoji">📌</span>題名</label>
      <input id="title" class="field" type="text" placeholder="第１回">
    </div>

    <div class="field-block">
      <label><span class="emoji">🖊️</span>渡部紗朱</label>
    </div>

    <div class="divider">・゚✧</div>

    <div class="field-block">
      <label><span class="emoji">🌟</span></label>
    </div>

    <div class="field-block" style="margin-bottom: 6px;">
      <label><span class="emoji">📝</span>本文</label>
      <textarea id="body" class="field" placeholder="IPアドレス： 172.5.5.99：福井、京都、兵庫に旅行に行った。博物館や街並みをがとても綺麗だったけれどすごく暑かった。『話を聞かない男、地図が読めない女』を最近読んだ。男女の脳の違いが日常生活を通して解説されていて分かりやすかった。"></textarea>
    </div>

    <div class="footer-row">
      <button class="chip pink" onclick="clearAll()">🧹 クリア</button>
      <button class="chip" onclick="window.print()">🖨️ 印刷</button>
    </div>
  </div>
</div>

<script>
  function clearAll() {
    document.getElementById('title').value = '';
    document.getElementById('name').value = '';
    document.getElementById('heading').value = '';
    document.getElementById('body').value = '';
  }
</script>

</body>
</html>
