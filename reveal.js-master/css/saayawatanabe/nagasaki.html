    <h1>県立長崎図書館の感想</h1>
    <h4>2515071 渡部紗朱</h4>
    
    <div class="note">
      <p>学校経営と学校図書館の授業で、理想的な図書館として地域連携が重要だということをずっと学習してきてあまり具体的なイメージが沸いていなかったが、県立長崎図書館のパンフレットを見て、地域連携がなされた図書館とはこういうことなんだと思った。</p>
    </div>
    <div class="note">
      <p>また、課題解決支援サービスや講座という地域と深く関わりあった取り組みがされていて開放的な図書館だなと思った。視覚障害者や車椅子の人、親子など、多様性を配慮したつくりになっており、返却ポストが24時間対応なのも、働いてる人に配慮されていて使いやすいと思った。
    </div>
